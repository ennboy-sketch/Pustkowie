name: Publish Pustkowie

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Check game logic
        run: node --test tests/*.test.cjs
      - name: Prepare the public site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp -R dist _site/dist
          touch _site/.nojekyll
          printf '{"commit":"%s"}\n' "$GITHUB_SHA" > _site/deployment.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish the game
        id: deployment
        uses: actions/deploy-pages@v4
