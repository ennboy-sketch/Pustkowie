<!doctype html>
<html lang="pl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#101916"><title>Pustkowie</title><link rel="stylesheet" href="style.css?v=combat-auto-location-1"><link rel="stylesheet" href="hub.css?v=combat-auto-location-1"><link rel="stylesheet" href="icons.css?v=combat-auto-location-1"><link rel="stylesheet" href="wheel.css?v=combat-auto-location-1"><script src="wheel.js?v=combat-auto-location-1" defer></script><link rel="stylesheet" href="tavern.css?v=combat-auto-location-1"><script src="progression.js?v=combat-auto-location-1" defer></script><script src="energy.js?v=combat-auto-location-1" defer></script><script src="beer.js?v=combat-auto-location-1" defer></script><link rel="stylesheet" href="missions.css?v=combat-auto-location-1"><link rel="stylesheet" href="combat.css?v=combat-auto-location-1"><script src="combat.js?v=combat-auto-location-1" defer></script><script src="missions.js?v=combat-auto-location-1" defer></script><script src="tavern.js?v=combat-auto-location-1" defer></script><script src="hub.js?v=combat-auto-location-1" defer></script><script src="game.js?v=combat-auto-location-1" defer></script></head>
<body>
<main class="game">
<header><a class="logo" href="./" aria-label="Pustkowie"><span class="crest" aria-hidden="true">✦</span><span>PUSTKOWIE</span><span class="logo-line" aria-hidden="true"></span></a></header>
<section id="choose" class="screen" aria-label="Wybór postaci">
<div id="classes" class="classes" role="group" aria-label="Klasa postaci"></div>
<div class="gender" role="group" aria-label="Płeć postaci"><button type="button" data-gender="male" aria-pressed="true"><span aria-hidden="true">♂</span> Męska</button><button type="button" data-gender="female" aria-pressed="false"><span aria-hidden="true">♀</span> Żeńska</button></div>
<div class="stage"><div class="halo" aria-hidden="true"></div><button type="button" class="arrow previous" id="previous" aria-label="Poprzednia klasa">‹</button><div class="character" id="choice-art" role="img"></div><button type="button" class="arrow following" id="following" aria-label="Następna klasa">›</button><div class="rune-ring" aria-hidden="true"></div></div>
<div class="bottom"><h1 id="class-name" aria-live="polite"></h1><div class="ornament" aria-hidden="true">◆</div><button type="button" class="primary" id="next">Dalej <span aria-hidden="true">➜</span></button></div>
</section>
<section id="naming" class="screen" hidden aria-labelledby="name-heading"><button type="button" class="back" id="back">‹ Wróć</button><div class="stage compact"><div class="halo" aria-hidden="true"></div><div class="character" id="name-art" role="img"></div><div class="rune-ring" aria-hidden="true"></div></div><form id="name-form" class="name-form"><h1 id="name-heading" tabindex="-1">Twoja nazwa</h1><div class="ornament" aria-hidden="true">◆</div><label class="sr-only" for="hero-name">Nazwa postaci</label><input id="hero-name" name="name" type="text" placeholder="Nazwa postaci" minlength="2" maxlength="24" required autocomplete="off" spellcheck="false" aria-describedby="name-error"><p id="name-error" class="error" aria-live="polite"></p><button type="submit" class="primary">Stwórz postać <span aria-hidden="true">➜</span></button></form></section>
<section id="ready" class="hub" hidden aria-label="Interfejs gry">
<aside class="sidebar" id="sidebar" aria-label="Menu gry">
<div class="hub-brand">✦ PUSTKOWIE <button id="close-menu" type="button" aria-label="Zamknij menu">×</button></div>
<button class="profile" type="button" data-place="hero" aria-label="Otwórz kartę bohatera"><span class="avatar"><span id="avatar-art" class="character"></span><span class="level">1</span></span><span class="profile-text"><strong id="ready-name" tabindex="-1"></strong><span id="identity"></span><span id="hero-profession" hidden></span><span class="small-xp"><i></i></span><small>Poziom 1</small></span></button>
<div class="resources" aria-label="Zasoby"><span title="Złoto"><span class="rpg-icon icon-coin" aria-hidden="true"></span> <strong id="gold-balance">25</strong> <small>Złoto</small></span><span title="Odłamki"><span class="rpg-icon icon-shard" aria-hidden="true"></span> <strong id="shard-balance">0</strong> <small>Odłamki</small></span><span title="Energia"><span class="rpg-icon icon-energy" aria-hidden="true"></span> <strong id="energy-balance">100</strong> <small>Energia</small><small id="energy-reset-clock" title="Odnowienie do 100 energii co 24 godziny">↻ 24:00:00</small></span></div>
<nav id="hub-navigation" aria-label="Miejsca i postać"></nav>
<div class="sidebar-bottom"><button type="button" data-place="help" aria-label="Pomoc"><span class="rpg-icon icon-help" aria-hidden="true"></span></button><span>ZAMEK CZARNEJ STALI</span><button type="button" id="restart" aria-label="Zmień postać" title="Zmień postać">⟳</button></div>
</aside>
<div class="sidebar-scrim" id="sidebar-scrim" hidden></div>
<section class="world" aria-label="Mapa zamku">
<div class="world-topbar"><button type="button" id="menu-toggle" aria-label="Otwórz menu" aria-expanded="false" aria-controls="sidebar">☰</button><div><span class="world-kicker">OSTATNIE SCHRONIENIE</span><h1 id="settlement-title" tabindex="-1">Zamek Czarnej Stali</h1></div><button class="map-button" type="button" data-place="hero" aria-label="Moja postać"><span class="rpg-icon icon-hero" aria-hidden="true"></span> <span>Moja postać</span></button></div>
<div class="world-viewport"><div class="town-map" id="town-map"><div class="map-shade" aria-hidden="true"></div><div id="map-pins"></div><div class="map-caption"><span>✦</span> Zamek Czarnej Stali <small>Poziom 1</small></div></div></div>
<div class="world-bottom"><span><i></i> W bezpiecznym zamku</span><button type="button" data-place="journal">Dziennik <span aria-hidden="true">↗</span></button></div>
</section>
<dialog id="place-dialog" class="place-dialog" aria-labelledby="place-title"><div class="place-top"><span id="place-category"></span><button type="button" id="close-place" aria-label="Zamknij okno">×</button></div><h2 id="place-title"></h2><div id="place-content"></div></dialog>
</section>
<p id="status" role="status" aria-live="polite"></p>
<dialog id="reset-dialog"><h2>Zmienić postać?</h2><p>Zapisana postać zostanie usunięta.</p><div class="dialog-actions"><button type="button" id="cancel-reset" class="secondary">Anuluj</button><button type="button" id="confirm-reset" class="primary">Zmień</button></div></dialog>
</main></body></html>
